model:
  n_embd: 256
  n_heads: 8
  n_layers: 6
  block_size: 256

training:
  batch_size: 16
  epochs: 10
  learning_rate: 0.0005
  weight_decay: 0.01

data:
  dataset_path: data/flashcards.json
  raw_text_path: data/raw_wikipedia.txt
  max_samples: 50000

logging:
  log_interval: 50
  save_dir: checkpoints/
